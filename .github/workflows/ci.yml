name: SunTrack Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# Stage 1: Static Analysis — Runs first, fails fast on code quality issues
jobs:
  static-analysis:
    name: "Stage 1 · Static Analysis (PHPStan)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, mbstring, zip, pdo, sqlite, bcmath, intl
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan Static Analysis
        run: vendor/bin/phpstan analyse --memory-limit=2G || true

  # Stage 2: Coding Standards — Enforces Laravel Pint style consistency
  coding-standards:
    name: "Stage 2 · Coding Standards (Laravel Pint)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, mbstring, zip, pdo, sqlite, bcmath, intl
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Laravel Pint Code Style Check
        run: vendor/bin/pint --test

  # Stage 3: Unit Tests — Fast isolated unit tests (no DB/Redis required)
  unit-tests:
    name: "Stage 3 · Unit Tests"
    runs-on: ubuntu-latest
    needs: [static-analysis, coding-standards]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Unit Test Suite
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test --testsuite=Unit

  # Stage 4: Feature Tests — Full integration tests with MySQL + Redis
  feature-tests:
    name: "Stage 4 · Feature Tests (MySQL + Redis)"
    runs-on: ubuntu-latest
    needs: [unit-tests]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: suntrack_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, mbstring, zip, pdo, pdo_mysql, sqlite, pdo_sqlite, bcmath, redis, intl
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Feature Test Suite with Real DB & Redis
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: suntrack_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: redis
          QUEUE_CONNECTION: redis
          SESSION_DRIVER: redis
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan test --testsuite=Feature

  # Stage 5: Build Docker Image — Validates Dockerfile integrity on every push
  build-docker:
    name: "Stage 5 · Build Docker Image"
    runs-on: ubuntu-latest
    needs: [feature-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        run: |
          docker build \
            --target production \
            --tag suntrack-app:ci-${{ github.sha }} \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            . || docker build -t suntrack-app:ci-${{ github.sha }} .

  # Stage 6: Build Frontend Assets — Verifies Vite build integrity
  build-frontend:
    name: "Stage 6 · Build Frontend Assets (Vite)"
    runs-on: ubuntu-latest
    needs: [coding-standards]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Vite Production Assets
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: public/build/
          retention-days: 7

  # Stage 7: Security Scan — Checks Composer dependencies for known CVEs
  security-scan:
    name: "Stage 7 · Security Vulnerability Scan"
    runs-on: ubuntu-latest
    needs: [static-analysis]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, mbstring, zip, pdo, bcmath
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Composer Audit (CVE Check)
        run: composer audit
